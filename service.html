<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="GoodLife Awnings & Pavings services across the KwaZulu-Natal South Coast.">
<title>GoodLife Service | Awnings & Pavings</title>
<style>
:root{--red:#f01818;--deep:#2a0505;--line:#2b2b2b;--muted:#b8b8b8;--panel:#111}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}
header{position:sticky;top:0;z-index:20;background:#070707ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.brand img{width:50px;height:50px;object-fit:contain;border-radius:8px}.brand span{color:var(--red)}nav{display:flex;align-items:center;gap:10px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:11px;border:1px solid #7a1111;font-weight:900;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#111;color:#fff}.btn:hover,.btn:focus-visible{transform:translateY(-1px);box-shadow:0 10px 28px #f0181830;outline:2px solid #ff7777;outline-offset:2px}
.crumb{padding:24px 0 0;color:#d3d3d3;font-size:14px}.crumb a{color:#ff6262;font-weight:800}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:38px 0 66px}.visual{background:#0b0b0b;border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:480px;display:grid;place-items:center}.visual img{width:100%;height:520px;object-fit:cover}.tag{display:inline-block;background:var(--deep);color:#ff4545;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;text-transform:uppercase}.hero h1{font-size:clamp(42px,6vw,70px);line-height:1.01;margin:17px 0}.lead{font-size:19px;line-height:1.65;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.details{padding:0 0 80px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}.panel h2{margin:0 0 14px;font-size:29px}.panel p,.panel li{color:var(--muted);line-height:1.65}.panel ul{padding-left:20px;margin-bottom:0}.cta{margin-top:22px;background:linear-gradient(135deg,#260303,#0b0b0b 55%);border:1px solid #6f1111;border-radius:20px;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:22px}.cta h2{margin:0 0 8px}.cta p{margin:0;color:#ccc}.loading{padding:60px;text-align:center;color:#bbb}
footer{border-top:1px solid var(--line);padding:28px 0;color:#aaa}.foot{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
@media(max-width:820px){.hero,.grid{grid-template-columns:1fr}.hero{gap:26px}.visual{min-height:330px}.visual img{height:380px}.hero-copy{order:-1}.cta{align-items:flex-start;flex-direction:column}nav .secondary{display:none}}
@media(max-width:520px){.wrap{width:min(100% - 24px,1120px)}.brand{font-size:14px}.brand img{width:42px;height:42px}.hero{padding-top:28px}.hero h1{font-size:42px}.lead{font-size:17px}.actions .btn,.cta .btn{width:100%}.visual img{height:320px}.panel{padding:21px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="index.html" aria-label="GoodLife Home"><img id="brandLogo" alt="GoodLife knight logo"><span>Awnings &amp; Pavings</span></a><nav><a class="btn secondary" href="index.html">Home</a><a class="btn primary quote-link" href="index.html#contact">Request a Quote</a></nav></div></header>
<main id="page"><div class="loading">Loading GoodLife service…</div></main>
<footer><div class="wrap foot"><strong>GoodLife Awnings &amp; Pavings</strong><span>KwaZulu-Natal South Coast</span></div></footer>
<script>
const services={
 "aluminum-carports-awnings":{title:"Aluminum Carports/Awnings",intro:"Durable aluminium cover solutions designed to protect vehicles and improve outdoor areas across the South Coast.",about:"GoodLife installs practical aluminium carports and awnings suited to local homes, driveways and outdoor living spaces.",features:["Weather protection for vehicles and outdoor areas","A clean, modern exterior finish","Made to suit the available property space","Installed for practical everyday use"],uses:["Vehicle parking areas","Home entrances","Patios and outdoor spaces","Residential property improvements"]},
 "colorplus-carports-awnings":{title:"Colorplus Carports and Awnings",intro:"Long-lasting Colorplus cover solutions combining practical protection with a finished exterior appearance.",about:"Colorplus carports and awnings provide dependable overhead cover for vehicles, patios and other exposed areas.",features:["Durable coated finish","Protection from sun and rain","Designed around the property layout","Suitable for residential exterior upgrades"],uses:["Carports","Covered walkways","Patio areas","Outdoor entertainment spaces"]},
 "shadenets":{title:"Shadenets",intro:"Practical shade-net structures for vehicles, outdoor areas and reliable sun protection.",about:"GoodLife builds shade-net solutions that provide effective cover while keeping the structure visually light and practical.",features:["Effective everyday shade","Useful protection for parked vehicles","Flexible coverage options","Suitable for homes and larger parking areas"],uses:["Vehicle bays","Driveways","Courtyards","Outdoor work and leisure areas"]},
 "patio-balcony-awnings":{title:"Patio / Balcony Awnings",intro:"Permanent awning solutions that make patios, balconies and entertainment areas more comfortable and usable.",about:"A well-planned patio or balcony awning adds protection and helps turn an exposed space into a more useful part of the property.",features:["Improved shade and weather cover","More usable outdoor living space","Custom fit for the property","A practical exterior enhancement"],uses:["Patios","Balconies","Braai and entertainment areas","Outdoor seating spaces"]},
 "retaining-walls":{title:"Retaining Walls",intro:"Strong exterior retaining-wall solutions for landscaping, support and property improvement projects.",about:"GoodLife installs retaining walls to help manage levels, support landscaped areas and give outdoor spaces a structured finish.",features:["Support for sloped or raised areas","Defined garden and property levels","Durable block construction","Neat integration with exterior spaces"],uses:["Sloped properties","Garden terraces","Boundary landscaping","Driveway and yard improvements"]},
 "driveway-paving":{title:"Driveway Paving",intro:"Professional paving for driveways, entrances and vehicle areas built for daily use.",about:"GoodLife prepares and paves driveway areas to create a stronger, neater and more practical entrance to the property.",features:["A neat and durable driving surface","Improved property entrance","Practical drainage-aware preparation","Paving suited to vehicle traffic"],uses:["Residential driveways","Vehicle parking areas","Property entrances","Courtyard access"]},
 "walkway-paving":{title:"Walkway Paving",intro:"Neat paving for garden paths, pedestrian routes and practical access around the property.",about:"GoodLife walkway paving helps connect outdoor areas while improving underfoot comfort and the overall property finish.",features:["Defined pedestrian routes","Cleaner access in wet weather","Low-maintenance exterior finish","Flexible patterns and layouts"],uses:["Garden paths","Home entrances","Side passages","Pool and entertainment areas"]},
 "other":{title:"Other Exterior Projects",intro:"Have another exterior improvement in mind? Show GoodLife the space and explain what you need.",about:"GoodLife can assess related exterior projects that do not fit neatly into one service category and advise whether the team can assist.",features:["Direct discussion with Grant","Site-specific assessment","Practical recommendations","A clear quotation before work begins"],uses:["Custom exterior cover requests","Combined paving and awning projects","Property improvement ideas","Related outdoor requirements"]}
};
const slug=new URLSearchParams(location.search).get("service")||"other";
const item=services[slug]||services.other;
document.title=item.title+" | GoodLife Awnings & Pavings";
document.querySelectorAll(".quote-link").forEach(link=>link.href=`index.html?service=${encodeURIComponent(slug)}#contact`);
async function loadImage(){
 const saved=localStorage.getItem("goodlife_service_image_"+slug);
 const savedLogo=localStorage.getItem("goodlife_brand_logo");
 if(savedLogo)document.getElementById("brandLogo").src=savedLogo;
 if(saved&&savedLogo)return saved;
 try{
  const response=await fetch("GoodLife_Awnings_Pavings_Updated_Contacts%20(1).html");
  const html=await response.text();
  const doc=new DOMParser().parseFromString(html,"text/html");
  const card=[...doc.querySelectorAll(".card")].find(node=>node.querySelector("h3")?.textContent.trim()===item.title);
  const image=card?.querySelector("img")?.src||"";
  const logo=doc.querySelector(".brand img")?.src||"";
  if(logo)document.getElementById("brandLogo").src=logo;
  return image||logo;
 }catch{return ""}
}
function list(items){return items.map(value=>`<li>${value}</li>`).join("")}
async function render(){
 const image=await loadImage();
 document.getElementById("page").innerHTML=`
  <div class="wrap crumb"><a href="index.html">Home</a> / ${item.title}</div>
  <section class="wrap hero">
   <div class="visual">${image?`<img src="${image}" alt="GoodLife ${item.title} project">`:"<strong>GoodLife Awnings &amp; Pavings</strong>"}</div>
   <div class="hero-copy"><span class="tag">GoodLife service</span><h1>${item.title}</h1><p class="lead">${item.intro}</p><div class="actions"><a class="btn primary" href="index.html?service=${encodeURIComponent(slug)}#contact">Request a Quote</a><a class="btn secondary" href="index.html#services">Back to Home Services</a></div></div>
  </section>
  <section class="wrap details"><div class="grid"><article class="panel"><h2>About this service</h2><p>${item.about}</p><ul>${list(item.features)}</ul></article><article class="panel"><h2>Suitable for</h2><p>Discuss the site and intended use with Grant so GoodLife can recommend the right approach.</p><ul>${list(item.uses)}</ul></article></div><div class="cta"><div><h2>Ready to discuss your project?</h2><p>Send the project details and request a GoodLife quotation.</p></div><a class="btn primary" href="index.html?service=${encodeURIComponent(slug)}#contact">Get My Quote</a></div></section>`;
}
render();
</script>
</body>
</html>
